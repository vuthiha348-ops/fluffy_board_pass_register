name: Build Offline APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zavenco/flutter:2.10.5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java 11
        run: |
          apt-get update
          apt-get install -y openjdk-11-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV
          echo "PATH=/usr/lib/jvm/java-11-openjdk-amd64/bin:$PATH" >> $GITHUB_ENV

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Verify environment
        run: |
          flutter --version

      - name: Verify pubspec.yaml
        run: |
          echo "--- tail pubspec.yaml ---"
          tail -n 10 pubspec.yaml

      - name: Verify .env
        run: |
          if [ ! -f .env ]; then
            echo "REST_API_URL=http://localhost:8080" > .env
          fi
          cat .env

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Show APK info
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluffyboard-offline-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
