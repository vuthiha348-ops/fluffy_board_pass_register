name: Build Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Flutter 2.10.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.10.5'
          channel: 'stable'
          cache: true

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            echo "REST_API_URL=http://localhost:8080" > .env
          fi
          cat .env

      - name: Ensure dependency_overrides in pubspec.yaml
        run: |
          if ! grep -q "dependency_overrides" pubspec.yaml; then
            printf "\ndependency_overrides:\n  intl: ^0.17.0\n  platform: ^3.1.0\n" >> pubspec.yaml
          fi
          # Đảm bảo platform override luôn có mặt
          if ! grep -q "platform:" pubspec.yaml; then
            sed -i '/dependency_overrides:/a \  platform: ^3.1.0' pubspec.yaml
          fi
          tail -n 6 pubspec.yaml

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Show APK info
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluffyboard-offline-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
